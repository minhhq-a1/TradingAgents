name: Deploy

# Redeploys the Telegram bot on the VPS once CI passes on a push to development.
# Needs repo secrets VPS_HOST, VPS_USER, VPS_SSH_KEY and VPS_APP_DIR (the clone
# on the VPS); VPS_PORT is optional (default 22).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [development]

permissions: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: telegram bot on VPS
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Pull and rebuild over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          install -m 600 /dev/null ~/key && printf '%s\n' "$SSH_KEY" > ~/key
          # Deploy exactly the commit CI tested, not whatever development is now.
          ssh -i ~/key -p "$PORT" -o StrictHostKeyChecking=accept-new "$USER@$HOST" \
            "set -e; cd '$APP_DIR'; git fetch origin development; git checkout -q --detach '$SHA'; docker compose --profile telegram up -d --build telegram-bot; docker image prune -f"
