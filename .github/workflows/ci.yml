name: CI

on:
  push:
    branches: [main, development, 'v[0-9]+.[0-9]+.[0-9]+']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # A push to development must never cancel a deploy that is already running.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: tests (py${{ matrix.python-version }}${{ matrix.tz && format(', {0}', matrix.tz) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # One run away from UTC, so a test that only passes in UTC fails here.
        include:
          - python-version: "3.12"
            tz: America/New_York
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run test suite
        run: pytest -q

  smoke-install:
    name: clean-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fresh install (no dev extras) and import
        run: |
          python -m pip install --upgrade pip
          pip install .
          # Catches undeclared runtime deps (e.g. #994 python-dotenv): a bare
          # install must import the package and the CLI module.
          python -c "import tradingagents, cli.main; print('clean-install import OK')"

  lint:
    name: ruff (strict, full repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.16"
      - name: Lint the repository
        # The repo is fully clean under the strict select, so we lint everything
        # (generated results/ is excluded via pyproject extend-exclude).
        run: ruff check .

  # Redeploys the Telegram bot on the VPS after a push to development passes CI.
  # Lives here, not in its own workflow: workflow_run only fires for files on the
  # default branch (main), which we never touch. Needs repo secrets VPS_HOST,
  # VPS_USER, VPS_SSH_KEY, VPS_APP_DIR; VPS_PORT is optional (default 22).
  deploy:
    name: deploy telegram bot to VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    needs: [test, smoke-install, lint]
    runs-on: ubuntu-latest
    # A hung build on the small VPS must not block every later deploy (the job queue is serial).
    timeout-minutes: 20
    permissions: {}
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Pull and rebuild over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
          SHA: ${{ github.sha }}
        run: |
          install -m 600 /dev/null ~/key && printf '%s\n' "$SSH_KEY" > ~/key
          # Deploy exactly the commit CI tested, not whatever development is now.
          ssh -i ~/key -p "$PORT" -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=4 "$USER@$HOST" \
            "set -e; cd '$APP_DIR'; git fetch origin development; git checkout -q --detach '$SHA'; docker compose --profile telegram up -d --build telegram-bot; docker image prune -f"
