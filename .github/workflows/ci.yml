name: CI

on:
  push:
    branches: [main, development, 'v[0-9]+.[0-9]+.[0-9]+']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # A push to development must never cancel a deploy that is already running.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: tests (py${{ matrix.python-version }}${{ matrix.tz && format(', {0}', matrix.tz) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # One run away from UTC, so a test that only passes in UTC fails here.
        include:
          - python-version: "3.12"
            tz: America/New_York
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run test suite
        run: pytest -q

  smoke-install:
    name: clean-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fresh install (no dev extras) and import
        run: |
          python -m pip install --upgrade pip
          pip install .
          # Catches undeclared runtime deps (e.g. #994 python-dotenv): a bare
          # install must import the package and the CLI module.
          python -c "import tradingagents, cli.main; print('clean-install import OK')"

  lint:
    name: ruff (strict, full repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.16"
      - name: Lint the repository
        # The repo is fully clean under the strict select, so we lint everything
        # (generated results/ is excluded via pyproject extend-exclude).
        run: ruff check .

  # Builds the image on the runner, so the small VPS never has to. Only after the
  # tests pass, and only for development (the branch that gets deployed).
  publish-image:
    name: build and push image
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    needs: [test, smoke-install, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # The image name must be lowercase; the source label links the package to this repo.
          tags: |
            ghcr.io/minhhq-a1/tradingagents:development
            ghcr.io/minhhq-a1/tradingagents:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Redeploys the Telegram bot on the VPS once the image is published. Lives here,
  # not in its own workflow: workflow_run only fires for files on the default branch
  # (main), which we never touch. Needs repo secrets VPS_HOST, VPS_USER, VPS_SSH_KEY,
  # VPS_APP_DIR (VPS_PORT optional, default 22), and a one-time `docker login ghcr.io`
  # on the VPS with a read:packages token.
  deploy:
    name: deploy telegram bot to VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    needs: [publish-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Pull the image and restart over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
          SHA: ${{ github.sha }}
        run: |
          install -m 600 /dev/null ~/key && printf '%s\n' "$SSH_KEY" > ~/key
          # Deploy exactly the commit CI tested and published, not whatever development is now.
          # The checkout only refreshes docker-compose.yml; the image itself comes from the registry.
          ssh -i ~/key -p "$PORT" -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=4 "$USER@$HOST" \
            "set -e; cd '$APP_DIR'; git fetch origin development; git checkout -q --detach '$SHA'; export TRADINGAGENTS_TAG='$SHA'; docker compose --profile telegram pull telegram-bot; docker compose --profile telegram up -d --no-build telegram-bot; docker image prune -f"
